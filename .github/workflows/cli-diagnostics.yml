name: CLI diagnostics and builds

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  format:
    name: Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Diagnostics and build (${{ matrix.target }})
    needs: format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: ''
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: ''
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
          version: 1.0
          execute_install_scripts: true
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cli-diagnostics-v1
          shared-key: cli-${{ matrix.target }}
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run diagnostics tests (no GPU required)
        run: cargo test --locked -p brush-cli -p brush-process -p brush-async --lib
      - name: Build both binaries
        run: cargo build --locked --release -p brush-cli -p brush-app --bins --target ${{ matrix.target }}
      - name: Smoke test command-line entrypoints
        shell: bash
        run: |
          for binary in brush-cli brush; do
            "target/${{ matrix.target }}/release/${binary}${{ matrix.suffix }}" --version
            "target/${{ matrix.target }}/release/${binary}${{ matrix.suffix }}" --help
          done
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item target/${{ matrix.target }}/release/brush-cli.exe, target/${{ matrix.target }}/release/brush.exe, README.md, LICENSE -Destination package
          Get-ChildItem package -File | Sort-Object Name | ForEach-Object {
            $digest = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($_.Name)"
          } | Set-Content -Encoding utf8 package/SHA256SUMS
          Compress-Archive -Path package/* -DestinationPath OOOBrush-${{ matrix.target }}.zip
      - name: Package Linux and macOS binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/brush-cli" "target/${{ matrix.target }}/release/brush" README.md LICENSE package/
          (
            cd package
            if [ "$RUNNER_OS" = "macOS" ]; then
              shasum -a 256 LICENSE README.md brush brush-cli > SHA256SUMS
            else
              sha256sum LICENSE README.md brush brush-cli > SHA256SUMS
            fi
          )
          tar -czf "OOOBrush-${{ matrix.target }}.tar.gz" -C package .
      - uses: actions/upload-artifact@v7
        with:
          name: OOOBrush-${{ matrix.target }}
          path: OOOBrush-${{ matrix.target }}.*
          retention-days: 14
          if-no-files-found: error
